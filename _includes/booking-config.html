{%- comment -%} Settings and translated strings for assets/js/booking.js {%- endcomment -%}
<script type="application/json" id="booking-config">
{
  "lang": {{ lang | jsonify }},
  "availabilityUrl": {{ '/assets/data/availability.json' | relative_url | jsonify }},
  "web3formsKey": {{ site.booking.web3forms_key | default: '' | jsonify }},
  "email": {{ site.contact.email | jsonify }},
  "phone": {{ site.contact.phone_link | jsonify }},
  "minNights": {{ site.booking.min_nights | default: 1 }},
  "discount": {{ site.booking.direct_discount | default: 0 }},
  "feeSummer": {{ site.booking.climate_fee_summer | default: 0 }},
  "feeWinter": {{ site.booking.climate_fee_winter | default: 0 }},
  "apartments": {
    {%- for a in site.data.apartments %}
    {{ a.id | jsonify }}: { "name": {% if lang == 'el' %}{{ a.name_el | jsonify }}{% else %}{{ a.name | jsonify }}{% endif %}, "nameEn": {{ a.name | jsonify }}, "guests": {{ a.guests }}, "bookingUrl": {{ site.locations[a.location].booking_com_url | jsonify }} }{% unless forloop.last %},{% endunless %}
    {%- endfor %}
  },
  "t": {
    "cal": {{ t.cal | jsonify }},
    "adults": {{ t.adults | jsonify }},
    "children": {{ t.children | jsonify }},
    "noDates": {{ t.no_dates | jsonify }},
    "tooMany": {{ t.too_many_guests | jsonify }},
    "sending": {{ t.sending | jsonify }},
    "submit": {{ t.submit | jsonify }},
    "error": {{ t.error_text | jsonify }},
    "mailFallback": {{ t.mail_fallback | jsonify }},
    "feeNote": {{ t.fee_note | jsonify }}
  }
}
</script>
