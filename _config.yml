title: Georgia's Family Apartments
url: https://www.creteimages.eu
baseurl: ""

# ── Contact details (shown on every page) ───────────────────────────────
contact:
  phone: "+30 698 244 6045"
  phone_link: "+306982446045"      # digits only, used for tel: and WhatsApp
  email: dimisgiort@hotmail.com

# ── The two buildings (apartments refer to these by id) ─────────────────
locations:
  mnisikli:
    street: "Mnisikli 23"
    postcode: "713 05"
    area: "Mastampas"
    address: "Mnisikli 23, 713 05 Heraklion, Crete"
    maps_query: "Mnisikli 23, Heraklion 713 05, Greece"
    lat: 35.32087
    lng: 25.12719
    booking_com_url: https://www.booking.com/Share-GlThg7
  dramountani:
    street: "Dramountani 15"
    postcode: "713 04"
    area: "Therissos"
    address: "Dramountani 15, 713 04 Heraklion, Crete"
    maps_query: "Dramountani 15, Heraklion 713 04, Greece"
    lat: 35.33289
    lng: 25.11888
    booking_com_url: https://www.booking.com/Share-RNglrD

# ── Booking ──────────────────────────────────────────────────────────────
booking:
  # Free key from https://web3forms.com (enter the email that should receive
  # booking requests). While empty, the form opens the guest's email app instead.
  web3forms_key: "aabf6dbf-05ca-4b8c-8eb1-276c623d24cd"
  direct_discount: 10        # % shown as "book direct" saving; set 0 to hide
  min_nights: 1
  max_guests: 6
  # State climate-resilience fee per night, paid on arrival
  climate_fee_summer: 8      # April–October
  climate_fee_winter: 2      # November–March

# ── Visitor statistics ──────────────────────────────────────────────────
# Free, cookie-free counter: sign up at https://www.goatcounter.com and put your
# code here (e.g. "georgias" for georgias.goatcounter.com). Empty = no tracking.
analytics:
  goatcounter: ""

# ── Build ────────────────────────────────────────────────────────────────
markdown: kramdown
exclude:
  - tools
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .github

defaults:
  - scope: { path: "" }
    values: { lang: en }
  - scope: { path: "el" }
    values: { lang: el }
