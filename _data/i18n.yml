  welcome_title: "Ανυπομονούμε να σας καλωσορίσουμε"
  welcome_text:
    - "Τα Georgia's Family Apartments είναι τρία οικογενειακά διαμερίσματα σε δύο από τις πιο ήσυχες γειτονιές του Ηρακλείου: το Natural και το Garden στην οδό Μνησικλή στον Μασταμπά, και το Standard στην οδό Δραμουντάνη στα δυτικά της πόλης, λίγα λεπτά με τα πόδια από την παραλία της Αμμουδάρας. Περιτριγυρισμένα από κήπους, είναι το μέρος όπου επιστρέφετε μετά από μια μέρα στη θάλασσα και νιώθετε αμέσως σαν στο σπίτι σας."
    - "Είτε είστε οικογένεια, παρέα φίλων ή ταξιδεύετε μόνοι, θα έχετε ένα ολόκληρο διαμέρισμα δικό σας: πλήρη κουζίνα, κλιματισμό, δωρεάν Wi-Fi και μπαλκόνι ή κήπο για να απολαύσετε τον κρητικό καιρό."
  features:
    - { icon: home, title: "Μια αληθινή γειτονιά", text: "Ήσυχοι, πράσινοι δρόμοι με φούρνους, σούπερ μάρκετ και ταβέρνες στη γωνία — και το ιστορικό κέντρο σε λιγότερο από 2 χλμ." }
    - { icon: sparkle, title: "Πεντακάθαρα & άνετα", text: "Φρέσκα σεντόνια και πετσέτες, καλά εξοπλισμένες κουζίνες και αναπαυτικά κρεβάτια — με τη φροντίδα μιας οικογενειακής επιχείρησης." }
    - { icon: sun, title: "Οι διακοπές σας στην Κρήτη", text: "Κνωσός, ενετικό λιμάνι, αμμουδιές και ορεινά χωριά — όλα σε μικρή απόσταση με το αυτοκίνητο." }

  apartments_title: "Τα διαμερίσματα"
  apartments_intro: "Κάθε διαμέρισμα είναι ένα ολόκληρο σπίτι για πέντε ή έξι άτομα, με δύο ή τρία υπνοδωμάτια, σαλόνι, πλήρη κουζίνα και δικό του μπάνιο."
