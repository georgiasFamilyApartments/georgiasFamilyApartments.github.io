    - "Georgia's Family Apartments are three family-run homes in two of Heraklion's calmest residential neighbourhoods: the Natural and Garden apartments on Mnisikli Street in Mastampas, and the Standard Apartment on Dramountani Street in the west of the city, a short walk from Amoudara beach. Surrounded by gardens, they're the kind of place you come back to after a long day at the beach and immediately feel at home."
