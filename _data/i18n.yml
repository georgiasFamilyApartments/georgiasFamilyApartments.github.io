  hero_text: "Τρία ευρύχωρα, πεντακάθαρα διαμερίσματα σε ήσυχες, πράσινες γειτονιές του Ηρακλείου — λίγα λεπτά από την παλιά πόλη, το λιμάνι και τις παραλίες."
