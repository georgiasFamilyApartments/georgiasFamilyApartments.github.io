# The three apartments. Order here = order on the website.
# `location` refers to one of the `locations` in _config.yml.
# Details follow the Booking.com listings (room ids in the comments).
#
# Adding photos: run tools/optimize-images.sh on the new pictures into
# assets/img/<id>/, then add the file name (without -480/-960/-1600.webp)
# to `photos` with a `tag` from the `photo_tags` list in _data/i18n.yml.
# The first photo is the cover.

# Booking.com room 220487303 "Apartment with Garden View"
- id: natural
  name: Natural Apartment
  name_el: Natural Διαμέρισμα
  location: mnisikli
  size: 92
  guests: 6
  bedrooms: 2
  checkin: "13:00–23:00"
  checkout: "08:00–11:00"
  price_from:            # e.g. 55 → shows "from €55 / night"; leave empty to hide
  amenities: [wifi, ac, heating, parking, kitchen, dishwasher, washer, tv, iron, hairdryer, fireplace, balcony]
  beds:
    en: ["Bedroom 1 · double bed", "Bedroom 2 · two single beds", "Living room · two sofa beds"]
    el: ["Υπνοδωμάτιο 1 · διπλό κρεβάτι", "Υπνοδωμάτιο 2 · δύο μονά κρεβάτια", "Σαλόνι · δύο καναπέδες-κρεβάτια"]
  summary:
    en: Warm and spacious, with a fireplace, a family kitchen, a balcony and a bougainvillea-framed entrance.
    el: Ζεστό και ευρύχωρο, με τζάκι, οικογενειακή κουζίνα, μπαλκόνι και είσοδο στολισμένη με βουκαμβίλιες.
  description:
    en: >-
      The Natural Apartment is our warmest space: 92 m² with a cosy living room built around a fireplace,
      two bedrooms, a wooden fully equipped kitchen with dishwasher and a big dining table, and a bathroom
      with washing machine. Have your morning coffee on the balcony overlooking the garden. Double-glazed
      windows, screens and solar hot water keep it comfortable all year, and you walk in under a cascade
      of bougainvillea.
    el: >-
      Το Natural Διαμέρισμα είναι ο πιο ζεστός μας χώρος: 92 τ.μ. με άνετο σαλόνι γύρω από το τζάκι, δύο
      υπνοδωμάτια, ξύλινη πλήρως εξοπλισμένη κουζίνα με πλυντήριο πιάτων και μεγάλη τραπεζαρία, και μπάνιο
      με πλυντήριο ρούχων. Πιείτε τον πρωινό σας καφέ στο μπαλκόνι με θέα στον κήπο. Διπλά τζάμια, σίτες
      και ηλιακός θερμοσίφωνας το κάνουν άνετο όλο τον χρόνο, ενώ μπαίνετε κάτω από έναν καταρράκτη από
      βουκαμβίλιες.
  photos:
    - { src: 01-living, tag: living }
    - { src: 06-bedroom-double, tag: bedroom }
    - { src: 05-kitchen, tag: kitchen }
    - { src: 02-living-fireplace, tag: fireplace }
    - { src: 17-bougainvillea, tag: entrance }
    - { src: 03-living, tag: living }
    - { src: 04-living-kitchen, tag: living }
    - { src: 19-dining, tag: dining }
    - { src: 18-kitchen, tag: kitchen }
    - { src: 20-balcony, tag: balcony }
    - { src: 07-bedroom-twin, tag: bedroom }
    - { src: 08-bedroom, tag: bedroom }
    - { src: 16-fireplace, tag: fireplace }
    - { src: 09-hallway, tag: hallway }
    - { src: 10-bathroom, tag: bathroom }
    - { src: 12-shower, tag: bathroom }
    - { src: 13-sink, tag: bathroom }
    - { src: 11-laundry, tag: laundry }
    - { src: 14-iron, tag: iron }
    - { src: 22-entrance-stairs, tag: entrance }
    - { src: 21-entrance, tag: entrance }
    - { src: 15-entrance, tag: entrance }

# Booking.com room 220487304 "Apartment - Ground Floor"
