# Booking.com: separate listing "Georgias Family Apartment 2" (Three-Bedroom Apartment, room 220487306)
- id: standard
  name: Standard Apartment
  name_el: Standard Διαμέρισμα
  location: dramountani
  size: 110
  guests: 5
  bedrooms: 3
  checkin: "14:00–23:00"
  checkout: "11:00–12:00"
  price_from:
  amenities: [wifi, ac, heating, kitchen, tv, iron, hairdryer, bathtub, balcony, cot]
  beds:
    en: ["1 double bed", "2 single beds", "1 futon", "1 sofa bed in the living room"]
    el: ["1 διπλό κρεβάτι", "2 μονά κρεβάτια", "1 futon", "1 καναπές-κρεβάτι στο σαλόνι"]
  summary:
    en: Three bedrooms and a garden-view balcony, a short walk from Amoudara beach.
    el: Τρία υπνοδωμάτια και μπαλκόνι με θέα στον κήπο, λίγα λεπτά με τα πόδια από την παραλία της Αμμουδάρας.
  description:
    en: >-
      Our Standard Apartment is a bright, spacious 110 m² home in a quiet street of western Heraklion, with
      three bedrooms, a living room with sofa bed, a dining area that seats the whole family, a fully
      equipped kitchen and a bathroom with bathtub. The balcony looks over the garden and inner courtyard.
      Amoudara beach is about a 14-minute walk away, and the old town is 1.5 km. Travelling with a little
      one? A travel cot is ready for you, free of charge.
    el: >-
      Το Standard Διαμέρισμα είναι ένα φωτεινό, ευρύχωρο σπίτι 110 τ.μ. σε ήσυχο δρόμο στα δυτικά του
      Ηρακλείου, με τρία υπνοδωμάτια, σαλόνι με καναπέ-κρεβάτι, τραπεζαρία για όλη την οικογένεια, πλήρως
      εξοπλισμένη κουζίνα και μπάνιο με μπανιέρα. Το μπαλκόνι βλέπει στον κήπο και στην εσωτερική αυλή.
      Η παραλία της Αμμουδάρας απέχει περίπου 14 λεπτά με τα πόδια και η παλιά πόλη 1,5 χλμ. Ταξιδεύετε
      με μωρό; Σας περιμένει βρεφικό κρεβατάκι, δωρεάν.
