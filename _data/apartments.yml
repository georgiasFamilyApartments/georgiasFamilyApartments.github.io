  name: Garden Apartment
  name_el: Garden Διαμέρισμα
  location: mnisikli
  size: 100
  guests: 5
  bedrooms: 2
  checkin: "13:00–23:00"
  checkout: "08:00–11:00"
  price_from:
  amenities: [wifi, ac, heating, parking, kitchen, dishwasher, washer, tv, iron, hairdryer, garden]
  beds:
    en: ["Bedroom 1 · double bed", "Bedroom 2 · two single beds", "Living room · sofa bed"]
    el: ["Υπνοδωμάτιο 1 · διπλό κρεβάτι", "Υπνοδωμάτιο 2 · δύο μονά κρεβάτια", "Σαλόνι · καναπές-κρεβάτι"]
  summary:
    en: Our largest apartment, on the ground floor, opening onto a green, shaded garden patio.
    el: Το μεγαλύτερο διαμέρισμά μας, στο ισόγειο, με πράσινη, σκιερή αυλή-κήπο.
  description:
    en: >-
      At 100 m², the Garden Apartment is our largest: a ground-floor home with a generous living room,
      a big dining table, two bedrooms, a modern fully equipped kitchen with dishwasher, and a bathroom
      with bathtub and washing machine. Its best feature is outside — a private, shaded garden patio full
      of plants and flowers, perfect for slow breakfasts and warm Cretan evenings.
    el: >-
      Με 100 τ.μ., το Garden Διαμέρισμα είναι το μεγαλύτερό μας: ένα ισόγειο σπίτι με ευρύχωρο σαλόνι,
      μεγάλη τραπεζαρία, δύο υπνοδωμάτια, σύγχρονη πλήρως εξοπλισμένη κουζίνα με πλυντήριο πιάτων και
      μπάνιο με μπανιέρα και πλυντήριο ρούχων. Το καλύτερό του σημείο είναι έξω — μια ιδιωτική, σκιερή
      αυλή-κήπος γεμάτη φυτά και λουλούδια, ιδανική για χαλαρά πρωινά και ζεστά κρητικά βράδια.
